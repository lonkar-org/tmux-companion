# The tmux-only key hold from docs/dev/design-key-routing.md, for M-a, as
# tests/e2e.rs's key-hold tests load it. HOLD_SECS is replaced by the test.
# [T] typed into the pane marks the tmux action, @log counts it where the pane
# can't show it (copy mode). `keys route` will generate this shape; until it
# does, this file is the shape under test.
set -g escape-time 5
set -g @kc_gen 0
# original tmux action, untouched, moved to its own table; formats expand at run time
bind -T kc-tmux M-a { set -gaF @log "T(#{client_name},#{pane_id},#{client_key_table}) " ; send-keys -l "[T]" }
bind -n M-a {
  if -F "#{&&:#{==:#{pane_current_command},#{@kc_owner}},#{m:*|M-a|*,#{@kc_claim}}}" {
    switch-client -T kc-hold-M-a
    set -gF @kc_gen "#{e|+:#{@kc_gen},1}"
    set -gF "@kc_hold_#{client_pid}" "#{@kc_gen}"
    run-shell -b -d HOLD_SECS -C "if -F '##{&&:##{==:##{client_key_table},kc-hold-M-a},##{==:##{@kc_hold_#{client_pid}},#{@kc_gen}}}' { switch-client -c '#{client_name}' -T kc-tmux ; send-keys -c '#{client_name}' -K M-a }"
  } {
    switch-client -T kc-tmux ; send-keys -K M-a
  }
}
bind -T kc-hold-M-a M-a { switch-client -T root ; send-keys }
bind -T kc-hold-M-a Any { switch-client -T kc-tmux ; send-keys -K M-a ; send-keys -K }
bind -n M-s { send-keys -l '[S]' }
