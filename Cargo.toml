[package]
name = "tmux-companion"
version = "0.9.1"
edition = "2024"
# The floor the locked tree builds on, not the floor the source needs: the
# code itself wants 1.88 (let chains), and sysinfo 0.39.3 in Cargo.lock wants
# 1.95. A number the lockfile contradicts is a promise nobody can keep, so the
# lock decides and the msrv job in ci.yml checks it with the lock in place.
rust-version = "1.95"
description = "A tmux companion: one daemon draws the status bar, and one binary does projects, snapshots and restore, pickers and a flash-style jump. Also a library for its daemon client, git and tmux-format parsing, and session snapshots."
license = "MIT"
repository = "https://github.com/lonkar-org/tmux-companion"
homepage = "https://github.com/lonkar-org/tmux-companion"
documentation = "https://docs.rs/tmux-companion"
readme = "README.md"
keywords = ["tmux", "status-line", "session", "git", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# What `cargo publish` uploads: the source, the files it embeds with
# include_str!, the manual and the example configs a user copies. Not the
# demo recordings, the playground image, the workflows or the scripts, which
# are for working on this repository rather than building it.
include = [
    "/src/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/docs/tmux-companion.1",
    "/docs/config.example.toml",
    "/docs/tmux.conf.example",
    "/docs/tmux.conf.starter.example",
    "/docs/tmux.conf.full.example",
    "/tests/fixtures/**/*",
]

# Unix sockets and nix make this a unix-only crate, and docs.rs would
# otherwise try its whole default target list, Windows included.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "tmux-companion"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5",  features = ["derive"] }
tokio       = { version = "1.40", features = ["full"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
nix         = { version = "0.29", features = ["fs", "process", "signal", "user", "resource", "term"] }
anyhow      = "1.0"
libc        = "0.2"
regex       = "1.11"
sysinfo     = "0.39"
# starship-battery is the maintained fork of `battery`, which was last
# released in 2020 and pulls nix 0.19, flagged for an out-of-bounds write.
# The same API, renamed back so every `battery::` path stays as it was.
battery     = { package = "starship-battery", version = "0.12" }
toml = "1.1"
ratatui = "0.30.0"
nucleo-matcher = "0.3.1"
toml_edit = "0.25.15"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.12"
