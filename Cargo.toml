[package]
name = "tmux-companion"
version = "0.4.0"
edition = "2024"
# The floor the locked tree builds on, not the floor the source needs: the
# code itself wants 1.88 (let chains), and sysinfo 0.39.3 in Cargo.lock wants
# 1.95. A number the lockfile contradicts is a promise nobody can keep, so the
# lock decides and the msrv job in ci.yml checks it with the lock in place.
rust-version = "1.95"
description = "A singleton tmux status server: one process answers every status segment, so the bar costs one process spawn per refresh instead of five."
license = "MIT"
repository = "https://github.com/lonkar-org/tmux-companion"
readme = "README.md"
keywords = ["tmux", "status-line", "statusline", "git", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "tmux-companion"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5",  features = ["derive"] }
tokio       = { version = "1.40", features = ["full"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
nix         = { version = "0.29", features = ["fs", "process", "signal", "user", "resource", "term"] }
anyhow      = "1.0"
libc        = "0.2"
regex       = "1.11"
sysinfo     = "0.39"
battery     = "0.7"
toml = "1.1"
ratatui = "0.30.0"
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile = "3.12"
