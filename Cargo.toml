[package]
name = "tmux-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A singleton tmux status server: one process answers every status segment, so the bar costs one process spawn per refresh instead of five."
license = "MIT"
repository = "https://github.com/lonkar-org/tmux-companion"
readme = "README.md"
keywords = ["tmux", "status-line", "statusline", "git", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "tmux-companion"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5",  features = ["derive"] }
tokio       = { version = "1.40", features = ["full"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
nix         = { version = "0.29", features = ["process", "signal", "user", "resource"] }
anyhow      = "1.0"
regex       = "1.11"
sysinfo     = "0.39"
battery     = "0.7"
toml = "1.1"

[dev-dependencies]
tempfile = "3.12"
