name: Release

# Builds the four binaries and publishes them on a tag.
#
# Push a tag to start it:
#
#   git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0
#
# or run it by hand from the Actions tab with a tag name. A gate runs first:
# the tag has to match the version in Cargo.toml, CHANGELOG.md has to have a
# section for it, which the release notes open with, the tree has to hold no
# review marker, and rustfmt, clippy and the whole test suite have to pass on
# the locked tree, the same checks ci.yml runs on every push. The four builds
# wait on it, so a tag pushed on a red tree produces no binaries rather than
# four of them. Publishing then waits on the `release` environment, so an admin
# approves before anything reaches the Releases page. Configure that once under
# Settings, Environments, release, Required reviewers. Without the environment
# the publish job runs unapproved, which is worth knowing before the first tag.
#
# The last job pushes the new version and checksums into the Homebrew tap at
# lonkar-org/homebrew-tap. The repository is named for what Homebrew looks for
# rather than for how it reads: `brew tap lonkar-org/tap` expands the second
# half to `homebrew-tap`, so a repository called `tap` is reachable only
# through a rename redirect, and a redirect is one accidental repository away
# from pointing somewhere else. What users type is `lonkar-org/tap` either way.
# It needs a secret named TAP_DEPLOY_KEY on this repository: the private half of
# a write-enabled deploy key on lonkar-org/homebrew-tap. The workflow's own GITHUB_TOKEN
# cannot reach another repository, which is why a second credential exists at
# all, and a deploy key is the one kind of credential a repository owns itself.
# It is scoped to that repository's contents and to nothing else, so it is not
# tied to anybody's account and a leak of it reaches the tap and stops there.
#
#   ssh-keygen -t ed25519 -N '' -C tmux-companion-release -f tap-key
#   gh repo deploy-key add tap-key.pub --repo lonkar-org/homebrew-tap --allow-write \
#     --title 'tmux-companion release workflow'
#   gh secret set TAP_DEPLOY_KEY --repo lonkar-org/tmux-companion < tap-key
#   rm tap-key tap-key.pub
#
# Without it the release still publishes and the job warns, so a missing key
# costs a stale tap rather than a failed release.
#
# The crate job publishes the same tag to crates.io, so `cargo install
# --locked tmux-companion` builds it and a crates.io search finds it. It runs
# after the approved publish job, so the one approval covers both. It signs in
# with trusted publishing: GitHub vouches for this workflow over OIDC and
# crates.io hands back a token that lasts thirty minutes, so no long-lived
# crates.io token sits on the repository. It is configured on crates.io under
# the crate's Settings, Trusted Publishing: owner lonkar-org, repository
# tmux-companion, workflow release.yml, and no environment, since this job
# runs in none.
#
# It is the only way in. Up to 0.8.0 a CARGO_REGISTRY_TOKEN secret, there for
# the crate's first version, took precedence when set; on 2026-10-06 the
# trusted publisher was configured, the secret and its token deleted, and the
# fallback taken out with them, so a secret added back later cannot quietly
# become the path again. A version already on crates.io is skipped, so
# rerunning the job after a failure later in the workflow is safe: a published
# version can be yanked but never replaced.
#
# Each `uses:` is pinned to a commit SHA with its version in a trailing
# comment, the same as playground.yml, which says why: this job holds that key.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, for example v0.1.0'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    name: Tag, tests and lints
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # First, because it fails in a second and is the one a release most
      # often gets wrong. `cargo pkgid` prints
      #   path+file:///home/runner/work/tmux-companion/tmux-companion#0.2.0
      # when the directory is named for the package, which a runner's checkout
      # is, and
      #   path+file:///somewhere/agent-a6cf#tmux-companion@0.2.0
      # when it is not, which a worktree is. The sed drops everything up to
      # the `#` and then a `name@` if one is there, and gives 0.2.0 for both.
      - name: The tag names the version in Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo pkgid | sed -E 's/.*#(.*@)?//')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag is $TAG but Cargo.toml says $version; bump one of them and tag again"
            exit 1
          fi
          echo "Cargo.toml says $version and the tag is $TAG"

      # The release notes open with this section, so a tag whose changelog
      # was never cut from `## Unreleased` stops here rather than publishing
      # a release that says nothing about what changed.
      - name: The changelog has a section for the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/changelog-section.sh "$TAG" > /dev/null

      - run: ./scripts/check-review-marks.sh

      # tests/e2e.rs drives a real tmux and, with CI set, fails rather than
      # skips when there is none. Not apt's: the same pinned versions ci.yml
      # tests on, built by scripts/tmux-build.sh, so a release cannot pass on a
      # tmux that CI never ran.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - run: rustup show active-toolchain || rustup toolchain install

      # main's cache from ci.yml's tests job, restored and never saved. A run
      # on a tag reads caches from its own ref and the default branch only,
      # so what a release saved no later release could reach: the gate-cargo
      # entries were space taken from main's for nothing. The same shared-key
      # and key as that job, with the environment hash off as it is there
      # (ci.yml says why), so the two compute the same key.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          shared-key: tests
          add-rust-environment-hash-key: false
          key: ubuntu-latest
          save-if: false

      # --locked, as the builds below are: the tree under test is the tree
      # that ships. --no-fail-fast so every test binary runs and the log names
      # each one that went red rather than only the first.
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests on every pinned tmux
        run: |
          status=0
          for v in $(scripts/tmux-build.sh --versions); do
            bin=$(scripts/tmux-build.sh "$v")
            echo "== tmux $v"
            PATH="$bin:$PATH" cargo test --no-fail-fast --all-targets --locked || status=1
          done
          exit $status
      - run: cargo test --doc --locked

  build:
    name: ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on any distribution rather than
          # tracking whichever glibc the runner happened to ship. The crate has
          # no C dependencies, which is what makes a static link available.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Cross-compiled from the arm runner. Apple ships both back ends, so
          # this needs no extra toolchain, only the target.
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      - name: Install the musl linker
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # No cache here. It saved under the tag, which the next release cannot
      # read, and main never builds these targets in release mode, so there
      # is nothing worth restoring either.

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # A binary that cannot answer --version is not one worth publishing, and
      # this is free on the three targets the runner can execute.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/tmux-companion --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="tmux-companion-${tag}-${{ matrix.target }}.tar.gz"
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/tmux-companion" "$staging/"
          cp README.md LICENSE "$staging/"
          # The manual, so `scripts/install.sh` has one to install and
          # `man tmux-companion` works on a machine that never saw the repo.
          cp docs/tmux-companion.1 "$staging/"
          tar -czf "$name" -C "$staging" .
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # An admin approves here. Everything above has already run, so the approval
    # is a decision about publishing and not about whether it compiles.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      # One file, listing every archive, because scripts/install.sh refuses to
      # install anything that is not in it.
      - name: Checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt
          cat checksums.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            ./scripts/changelog-section.sh --details "$TAG"
            echo
            echo "The whole history is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md)."
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/$TAG/scripts/install.sh | bash"
            echo '```'
            echo
            echo "It picks the archive for your machine, checks it against \`checksums.txt\` below, and installs it."
            echo "Read the script first if you would rather not pipe it; that is a reasonable thing to want."
            echo
            echo "Or build it from crates.io: \`cargo install --locked tmux-companion\`."
            echo
            echo "With tpm, add \`set -g @plugin '${{ github.repository }}'\` and reload."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat assets/checksums.txt
            echo '```'
          } > "$notes"
          gh release create "$TAG" assets/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file "$notes" \
            --generate-notes

  crate:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What GitHub signs the OIDC token with, for trusted publishing.
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - run: rustup show active-toolchain || rustup toolchain install

      # Asked of the API rather than left to `cargo publish`, whose refusal of
      # a duplicate is an error indistinguishable from any other.
      - name: Is this version on crates.io already
        id: exists
        run: |
          set -euo pipefail
          version="${TAG#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'tmux-companion release workflow (https://github.com/${{ github.repository }})' \
            "https://crates.io/api/v1/crates/tmux-companion/$version")
          if [ "$status" = 200 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tmux-companion $version is on crates.io already; nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        if: steps.exists.outputs.already == 'false'

      # --locked, so the build cargo verifies is the tree the gate tested.
      - name: cargo publish
        if: steps.exists.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  tap:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # A secret cannot be read in a job-level `if`, so the key is checked once
      # here and every step after it reads this output.
      - name: Is TAP_DEPLOY_KEY set
        id: token
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${TAP_DEPLOY_KEY:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_DEPLOY_KEY is not set, so lonkar-org/homebrew-tap still points at the previous version. Create the secret and rerun this job."
          fi

      # `ssh-key` rather than `token`, so checkout clones over SSH and leaves
      # the remote and the key configured for the push at the end of the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.have == 'true'
        with:
          repository: lonkar-org/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      # The tap owns the rewrite. Doing it there keeps one copy of the rules
      # about which archive belongs on which line, testable without a release.
      - name: Fill in the formula
        if: steps.token.outputs.have == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt --dir .
          ./scripts/update-formula.sh "$TAG" checksums.txt
          rm checksums.txt
          git --no-pager diff

      - name: Commit it
        if: steps.token.outputs.have == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/tmux-companion.rb; then
            echo "the formula already points at $TAG"
            exit 0
          fi
          git add Formula/tmux-companion.rb
          git commit -m "tmux-companion ${TAG#v}" \
            -m "From ${{ github.repository }} $TAG, checksums taken from the release."
          git push
