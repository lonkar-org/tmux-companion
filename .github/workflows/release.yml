name: Release

# Builds the four binaries and publishes them on a tag.
#
# Push a tag to start it:
#
#   git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0
#
# or run it by hand from the Actions tab with a tag name. The build runs
# straight away; publishing waits on the `release` environment, so an admin
# approves before anything reaches the Releases page. Configure that once under
# Settings, Environments, release, Required reviewers. Without the environment
# the publish job runs unapproved, which is worth knowing before the first tag.
#
# The last job pushes the new version and checksums into the Homebrew tap at
# lonkar-org/tap. `brew tap lonkar-org/tap` looks for a repository called
# `homebrew-tap` and reaches this one through the rename redirect GitHub keeps,
# which works and would stop working the day anything else takes that name.
# It needs a secret named TAP_TOKEN on this repository: a fine-grained personal
# access token whose only resource is that repository and whose only permission
# is Contents, read and write. The workflow's own
# GITHUB_TOKEN cannot reach another repository, which is why the secret exists.
#
#   gh secret set TAP_TOKEN --repo lonkar-org/tmux-companion
#
# Without it the release still publishes and the job warns, so a missing token
# costs a stale tap rather than a failed release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, for example v0.1.0'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on any distribution rather than
          # tracking whichever glibc the runner happened to ship. The crate has
          # no C dependencies, which is what makes a static link available.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Cross-compiled from the arm runner. Apple ships both back ends, so
          # this needs no extra toolchain, only the target.
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      - name: Install the musl linker
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # A binary that cannot answer --version is not one worth publishing, and
      # this is free on the three targets the runner can execute.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./target/${{ matrix.target }}/release/tmux-companion --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="tmux-companion-${tag}-${{ matrix.target }}.tar.gz"
          staging=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/tmux-companion" "$staging/"
          cp README.md LICENSE "$staging/"
          # The manual, so `scripts/install.sh` has one to install and
          # `man tmux-companion` works on a machine that never saw the repo.
          cp docs/tmux-companion.1 "$staging/"
          tar -czf "$name" -C "$staging" .
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # An admin approves here. Everything above has already run, so the approval
    # is a decision about publishing and not about whether it compiles.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # One file, listing every archive, because scripts/install.sh refuses to
      # install anything that is not in it.
      - name: Checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum ./*.tar.gz | sed 's| \./| |' > checksums.txt
          cat checksums.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/$TAG/scripts/install.sh | bash"
            echo '```'
            echo
            echo "It picks the archive for your machine, checks it against \`checksums.txt\` below, and installs it."
            echo "Read the script first if you would rather not pipe it; that is a reasonable thing to want."
            echo
            echo "With tpm, add \`set -g @plugin '${{ github.repository }}'\` and reload."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat assets/checksums.txt
            echo '```'
          } > "$notes"
          gh release create "$TAG" assets/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file "$notes" \
            --generate-notes

  tap:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # A secret cannot be read in a job-level `if`, so the token is checked
      # once here and every step after it reads this output.
      - name: Is TAP_TOKEN set
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TAP_TOKEN:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_TOKEN is not set, so lonkar-org/tap still points at the previous version. Create the secret and rerun this job."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.have == 'true'
        with:
          repository: lonkar-org/tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      # The tap owns the rewrite. Doing it there keeps one copy of the rules
      # about which archive belongs on which line, testable without a release.
      - name: Fill in the formula
        if: steps.token.outputs.have == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern checksums.txt --dir .
          ./scripts/update-formula.sh "$TAG" checksums.txt
          rm checksums.txt
          git --no-pager diff

      - name: Commit it
        if: steps.token.outputs.have == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/tmux-companion.rb; then
            echo "the formula already points at $TAG"
            exit 0
          fi
          git add Formula/tmux-companion.rb
          git commit -m "tmux-companion ${TAG#v}" \
            -m "From ${{ github.repository }} $TAG, checksums taken from the release."
          git push
