name: Docs

# The documentation site at https://with-love.lonkar.org/tmux-companion/,
# built with Starlight from site/ and published on GitHub Pages. It is a
# project site: with-love.lonkar.org is the custom domain of the org's own
# Pages repository, lonkar-org/lonkar-org.github.io, and every lonkar-org
# repository's Pages answers under it at its name.
#
# The words come from main: a push that changes docs/, the README, the
# changelog or site/ is on the site a minute or two later, with no release.
# While CHANGELOG.md's Unreleased section has entries, every page carries a
# banner naming the latest release, so a page that describes something brew
# can't install yet says so; site/scripts/sync.mjs writes it. The changelog
# is watched because cutting a release empties Unreleased and takes the
# banner down.
#
# A pull request that touches the same files builds the site and deploys
# nothing, so a broken page shows up before it merges. The Run button on the
# Actions tab deploys main again.
#
# This is the one workflow that watches Markdown, which is the exception the
# rule about ignoring it makes for a docs site.
#
# Pages has to be set up once, by hand: Settings, Pages, Source "GitHub
# Actions", and no custom domain of its own, so the org's applies. The DNS
# record for with-love.lonkar.org is in lonkar-org/lonkar.org, infra/.
#
# Each `uses:` is pinned to a commit SHA with its version in a trailing
# comment, the same as ci.yml and release.yml.

on:
  push:
    branches: [main]
    paths: &docs
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer one doesn't cancel one already going.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The man page is rendered with mandoc, the same formatter `man` uses on
      # most systems that have one.
      - name: Install mandoc
        run: sudo apt-get install -y --no-install-recommends mandoc

      - name: Build
        working-directory: site
        env:
          DOCS_REF: ${{ github.sha }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy

  # The check the ruleset on main requires, for a pull request that touches
  # only the site; ci.yml says why three workflows share the name.
  required:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "$RESULT"
          [ "$RESULT" = success ]
