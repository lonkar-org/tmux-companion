name: Docs

# The documentation site at https://with-love.lonkar.org/tmux-companion/,
# built with Starlight from site/ and published on GitHub Pages. It is a
# project site: with-love.lonkar.org is the custom domain of the org's own
# Pages repository, lonkar-org/lonkar-org.github.io, and every lonkar-org
# repository's Pages answers under it at its name.
#
# The words come from the latest release, so the site never documents a
# feature brew can't install yet: docs/ and README.md are checked out at that
# tag, over a checkout of main that has site/ in it. site/ comes from main
# because a tag older than the site has none, and a fix to how the site is
# built shouldn't wait for a release.
#
# It deploys when the Release workflow finishes, rather than on the release
# being published: that workflow creates the release with GITHUB_TOKEN, and
# an event GITHUB_TOKEN causes starts no other workflow. It deploys again on a
# push to main that changes site/, and by hand from the Actions tab, with a
# tag or the latest release. A pull request that touches the docs or the site
# builds it and deploys nothing, so a broken page shows up before it merges.
#
# This is the one workflow that watches Markdown, which is the exception the
# rule about ignoring it makes for a docs site.
#
# Pages has to be set up once, by hand: Settings, Pages, Source "GitHub
# Actions", and no custom domain of its own, so the org's applies. The DNS
# record for with-love.lonkar.org is in lonkar-org/lonkar.org, infra/.
#
# Each `uses:` is pinned to a commit SHA with its version in a trailing
# comment, the same as ci.yml and release.yml.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the docs from; empty for the latest release"
        required: false

permissions:
  contents: read

# One deploy at a time, and a newer one doesn't cancel one already going.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    # A release that failed published nothing, so there is nothing new to say.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A pull request builds the words it changes; everything else builds
      # the release's.
      - name: The docs from the release
        if: github.event_name != 'pull_request'
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A Release run started by hand names main, not its tag, so only
          # a v-tag is taken from it and anything else means the latest.
          case "${RUN_TAG:-}" in v*) ;; *) RUN_TAG="" ;; esac
          tag="${INPUT_TAG:-$RUN_TAG}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          git checkout "$tag" -- docs README.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building the docs of $tag with the site from $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The man page is rendered with mandoc, the same formatter `man` uses on
      # most systems that have one.
      - name: Install mandoc
        run: sudo apt-get install -y --no-install-recommends mandoc

      - name: Build
        working-directory: site
        env:
          DOCS_REF: ${{ steps.tag.outputs.tag || github.sha }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
