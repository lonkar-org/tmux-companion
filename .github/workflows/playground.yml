name: Playground image

# Builds and publishes the playground container.
#
# Same shape as release.yml: the build runs straight away on a tag, publishing
# waits on the `release` environment so an admin approves before anything
# reaches Docker Hub. Push a tag to start it, or run it from the Actions tab.
#
# Each architecture is built on a runner of that architecture rather than under
# emulation. A cargo build under qemu takes long enough to be worth two jobs
# and a manifest.
#
# Publishing needs three things set on the repository, and the publish job says
# which one is missing rather than failing inside `docker login`:
#
#   secret DOCKERHUB_USERNAME   the account the token belongs to
#   secret DOCKERHUB_TOKEN      an access token from Docker Hub, not a password
#   variable DOCKERHUB_IMAGE    namespace/repository, if it is not the default
#
# The two secrets go up from a local `.env.local`, which `.gitignore` covers:
#
#   gh secret set --env-file .env.local
#
# The image name is a variable because a Docker Hub namespace is not derivable
# from the GitHub one: Hub namespaces are lowercase alphanumeric, so a GitHub
# owner with a hyphen in it has no matching name on Hub.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, for example v0.1.0'
        required: true

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'lonkarorg/tmux-companion' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      # Built here and checked here, so a broken image is a failed build rather
      # than something somebody pulls. The smoke script asserts the projects,
      # the bar, the themes and the layout inside the container it just built.
      - name: Build and smoke test
        run: |
          docker build -f playground/Dockerfile -t playground:test .
          IMAGE=playground:test ./scripts/playground.sh smoke

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Said here, where it names the missing thing, rather than as a login
      # failure forty lines later that reads like a bad password.
      - name: Check the Docker Hub credentials are set
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=
          [ -n "$USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "missing repository secret(s):$missing" >&2
            echo "create an access token at https://app.docker.com/settings/personal-access-tokens" >&2
            exit 1
          fi
          echo "publishing to ${{ env.IMAGE }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Lower-cased, because a Docker Hub path has to be and a variable
      # somebody typed does not have to be.
      - id: name
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Both architectures in one job, which means one of them builds the
      # crate under qemu and takes tens of minutes. That is the price of
      # keeping the approval gate in front of the push: building natively per
      # architecture means pushing by digest before anybody has approved
      # anything. It runs on a tag, so it runs rarely.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: playground/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:playground
            ${{ steps.name.outputs.image }}:playground-${{ inputs.tag || github.ref_name }}
