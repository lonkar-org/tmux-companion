name: Playground image

# Builds and publishes the playground container.
#
# Same shape as release.yml: the build runs straight away on a tag, publishing
# waits on the `release` environment so an admin approves before anything
# reaches Docker Hub. Push a tag to start it, or run it from the Actions tab.
#
# Each architecture is built on a runner of that architecture rather than under
# emulation. A cargo build under qemu takes long enough to be worth two jobs
# and a manifest.
#
# Publishing needs three things set on the repository, and the publish job says
# which one is missing rather than failing inside `docker login`:
#
#   secret DOCKERHUB_USERNAME   the account the token belongs to
#   secret DOCKERHUB_TOKEN      an access token from Docker Hub, not a password
#   variable DOCKERHUB_IMAGE    namespace/repository, if it is not the default
#
# The token needs read/write to push the image and read/write/delete for the
# last step, which rewrites the repository description on Docker Hub. The
# description is the only part of this that cannot be shipped inside the image,
# so it is kept in playground/DOCKERHUB.md and pushed from here.
#
# The two secrets go up from a local `.env.local`, which `.gitignore` covers:
#
#   gh secret set --env-file .env.local
#
# The image name is a variable because a Docker Hub namespace is not derivable
# from the GitHub one: Hub namespaces are lowercase alphanumeric, so a GitHub
# owner with a hyphen in it has no matching name on Hub.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, for example v0.1.0'
        required: true

# The docker/* actions are on their current majors for the reason the comment
# in ci.yml gives for the actions/* ones: the previous majors ran on Node 20,
# which GitHub has deprecated, so the runner forced them onto Node 24 and
# annotated every run to say so. Checked 2026-09-23. All four need a runner of
# at least 2.327.1. Nothing here passes an input the new majors dropped:
# setup-buildx and setup-qemu are called bare, login-action still takes
# username and password, and build-push-action v7 removed only the
# DOCKER_BUILD_NO_SUMMARY and DOCKER_BUILD_EXPORT_RETENTION_DAYS envs, which
# this workflow never set.
#
# Every action is pinned to a commit, with the tag it was resolved from in the
# trailing comment. This job holds a Docker Hub token that can overwrite the
# image, and a tag is a pointer its owner can move: a moved tag runs whatever
# it now points at with that token in reach. A SHA cannot be moved. Dependabot
# (.github/dependabot.yml) proposes the next SHA and rewrites the comment.
# Resolve one by hand with
#   git ls-remote https://github.com/docker/login-action refs/tags/v4.6.0

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'lonkarorg/tmux-companion' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built here and checked here, so a broken image is a failed build rather
      # than something somebody pulls. The smoke script asserts the projects,
      # the bar, the themes and the layout inside the container it just built.
      #
      # Twice: with the hardening flags scripts/playground.sh runs by default
      # (read-only, no network, no capabilities), and with none, which is the
      # plain `docker run --rm -it` the README gives. Each is a way somebody
      # runs it, and a change can break one and not the other.
      #
      # Built through buildx with its layers saved to the Actions cache, every
      # stage of them (mode=max), one scope per runner, which is one per
      # architecture. That is for the publish job below: it builds both
      # architectures again, arm64 under qemu, and reading these scopes it
      # finds the cargo build already done natively here instead of spending
      # tens of minutes on it emulated. `load` puts the image in the runner's
      # docker for the smoke test and the scan, as `docker build` did. The
      # scopes live under the tag, which a later tag cannot read, so this pays
      # off within one run and not across releases.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: playground/Dockerfile
          load: true
          tags: playground:test
          cache-from: type=gha,scope=playground-${{ matrix.runner }}
          cache-to: type=gha,scope=playground-${{ matrix.runner }},mode=max

      - name: Smoke test
        run: |
          IMAGE=playground:test ./scripts/playground.sh smoke
          IMAGE=playground:test PLAIN=1 ./scripts/playground.sh smoke

      # A known vulnerability at HIGH or CRITICAL with a fixed version out
      # fails the build, so it is fixed by a rebuild before anybody approves a
      # publish. --ignore-unfixed drops the ones with no fix yet, from the
      # report as well as the exit status: a build that failed on those would
      # stay red until Alpine shipped a patch, with nothing to do but wait.
      #
      # Trivy's own image, pinned by digest, rather than trivy-action: one
      # pinned thing instead of an action that fetches the binary at run time,
      # and the same command runs on a laptop. Dependabot does not see an image
      # named in a `run:`, so this digest is bumped by hand; the vulnerability
      # database is not pinned and is fetched fresh on every run. The image is
      # handed over as a tarball rather than through the Docker socket, so the
      # scanner gets the image and nothing else on the runner.
      - name: Scan for fixable vulnerabilities
        run: |
          docker save playground:test -o "$RUNNER_TEMP/playground.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/playground.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    # id-token is for cosign below and nothing else: it lets the job ask
    # GitHub for a token that says "this workflow, at this ref", which is what
    # the signature is bound to. The build job never gets it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Said here, where it names the missing thing, rather than as a login
      # failure forty lines later that reads like a bad password.
      - name: Check the Docker Hub credentials are set
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=
          [ -n "$USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "missing repository secret(s):$missing" >&2
            echo "create an access token at https://app.docker.com/settings/personal-access-tokens" >&2
            exit 1
          fi
          echo "publishing to $IMAGE"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Lower-cased, because a Docker Hub path has to be and a variable
      # somebody typed does not have to be. Read from the environment rather
      # than templated into the script, so a quote in the variable is a bad
      # image name and not shell.
      - id: name
        run: echo "image=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Both architectures in one job, which means one of them builds the
      # crate under qemu and takes tens of minutes. That is the price of
      # keeping the approval gate in front of the push: building natively per
      # architecture means pushing by digest before anybody has approved
      # anything. It runs on a tag, so it runs rarely.
      #
      # With a provenance attestation (mode=max: the build's inputs, the
      # Dockerfile and the commit, not only that a build happened) and an
      # SBOM of every package in the image, both attached to the image
      # itself. `docker buildx imagetools inspect <image> --format
      # '{{ json .SBOM }}'` reads the SBOM back.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: playground/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          # The build job's layers, per architecture; see its Build step.
          cache-from: |
            type=gha,scope=playground-ubuntu-latest
            type=gha,scope=playground-ubuntu-24.04-arm
          tags: |
            ${{ steps.name.outputs.image }}:playground
            ${{ steps.name.outputs.image }}:playground-${{ inputs.tag || github.ref_name }}

      # Keyless: no key to make, store or rotate. cosign trades the job's
      # id-token for a short-lived certificate from Sigstore naming this
      # workflow and the ref it ran at, signs the digest just pushed, and
      # records it in Sigstore's public transparency log. The signature goes
      # to Docker Hub beside the image with the same token that pushed it.
      # docs/how-to/playground.md has the `cosign verify` line.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ steps.name.outputs.image }}
        run: cosign sign --yes "$NAME@$DIGEST"

      # The description on Docker Hub is the page anybody who finds the image
      # lands on first, and it is the one thing about the image that is not in
      # the image: it lives in Hub's own database and is set through the API.
      # Keeping it in playground/DOCKERHUB.md means it is reviewed with
      # everything else and pushed from here, rather than pasted into a web
      # form once and left to drift.
      #
      # continue-on-error, deliberately. This action wants a token with
      # read/write/delete scope, where pushing an image needs only read and
      # write, so a DOCKERHUB_TOKEN that publishes perfectly well can still be
      # refused here. A stale description is not worth failing a release whose
      # image is already pushed; the step goes red and says what happened.
      #
      # It runs whenever the push did, so a signing failure above does not
      # also leave the page stale.
      - name: Update the Docker Hub description
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.name.outputs.image }}
          readme-filepath: playground/DOCKERHUB.md
          short-description: >-
            A throwaway tmux with tmux-companion, five fake git projects and a
            eighteen step guided tour.
          enable-url-completion: true
