name: CodeQL

# Code scanning, as a file rather than GitHub's default setup, so it can skip
# a push that only changes Markdown the way every other workflow here does;
# the default setup has no path filter and scanned four languages for a
# README edit. The languages are the ones the default setup picked: Rust, the
# docs site's JavaScript and TypeScript, the Python bench scripts, and the
# workflows themselves. None needs a build, so each is scanned from source.
#
# The default setup has to be off for this one to upload; it was turned off
# on 2026-10-07, when this file landed. Settings, Code security, CodeQL analysis
# says which is in force.
#
# Each `uses:` is pinned to a commit SHA with its version in a trailing
# comment, the same as ci.yml and release.yml.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # Weekly as well, the default setup's schedule: new queries find old code.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
