name: CI

# Runs the three checks a contributor is asked to run before pushing, so a
# pull request fails here rather than in review. The toolchain comes from
# rust-toolchain.toml, which is what keeps the formatting identical to a
# maintainer's machine.

# Markdown is excluded because nothing in it is shipped or tested, with one
# exception. skills/tmux-companion/SKILL.md is `include_str!`ed by
# `the_skill_names_no_command_that_went_away` in tests/e2e.rs, so an edit to it
# is an edit to a test's input and has to run the suite. The other docs that
# *are* tested are not markdown: `the_manual_documents_every_subcommand` reads
# docs/tmux-companion.1 and the config tests read docs/config.example.toml, so
# both of those still start a run. A README or a CHANGELOG edit does not.
#
# It is `paths` with a negation rather than `paths-ignore`, because GitHub
# allows one or the other and only `paths` can carve an exception back out;
# later patterns win, so the file is re-included after the markdown is dropped.
#
# The ruleset on main requires one check, `required`, and three workflows end
# in a job of that name: this one, docs.yml and markdown.yml. Between their
# paths every file starts at least one of them, so a pull request always gets
# a `required`, and one that starts two has to pass both. GitHub leaves a
# required check pending rather than passing it when its workflow is skipped
# by paths, which is why the ruleset can't name this workflow's jobs. A new
# workflow with a paths filter of its own ends in `required` the same way.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!site/**'
      - '!.github/workflows/docs.yml'
      - 'skills/tmux-companion/SKILL.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!site/**'
      - '!.github/workflows/docs.yml'
      - 'skills/tmux-companion/SKILL.md'
  workflow_dispatch:

# The actions are on their current majors because the older ones ran on Node
# 20, which GitHub has deprecated: the runner forces them onto Node 24 anyway
# and annotates every run to say so. Checked 2026-09-23. `actions/cache@v5` and
# later need a runner of at least 2.327.1, which GitHub-hosted runners have and
# an old `act` image may not, so a local act run failing where CI passes is
# worth checking against `just act-refresh` before believing.
#
# Each `uses:` is pinned to a commit SHA with its version in a trailing
# comment, the same as playground.yml, which says why. Dependabot moves them.
# Read-only for every job: none of them writes to the repository, opens a
# release or comments, and a token with less on it is less to lose. Code
# scanning flagged the default, which on an older repository is read-write.
permissions:
  contents: read

# Cargo's caches are Swatinem/rust-cache rather than actions/cache keyed on
# Cargo.lock, since 2026-10-06. The hand-made keys had three faults, read off
# the repository's cache list that day: a key saved once was never saved
# again until Cargo.lock changed, so `target` aged with every commit; the
# clippy entries on macOS were 2.1 to 2.5 GB of incremental build output; and
# every pull request saved its own copies, Dependabot's alone 3.9 GB, which
# only that pull request could read and which pushed main's out of the 10 GB
# the repository gets. rust-cache keys on the compiler and the lockfile per
# job, drops incremental output and the workspace's own artifacts before
# saving, and with save-if a pull request restores main's cache and saves
# nothing. One cache per kind of job and OS: the three tmux legs of `tests` on
# an OS share one, and clippy, whose output is different, has its own.
#
# add-rust-environment-hash-key is off everywhere. The hash it adds covers
# every Rust toolchain installed on the runner, not the one rust-toolchain.toml
# pins, and GitHub rotates ubuntu-24.04 images that ship different stables
# (1.98.1 on one, 1.99.0 on the next), so each Linux cache had two keys and a
# job missed whenever it drew the other image; macOS hit every time. The key
# still turns over when it should: rust-toolchain.toml, Cargo.toml (which has
# rust-version, the msrv job's toolchain) and Cargo.lock are hashed in as
# files, and RUSTFLAGS is fixed per workflow.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the version; this installs it on a runner
      # whose preinstalled Rust is something else, and installs rustup itself
      # on one that has none. GitHub's images ship rustup, so the first line is
      # a no-op there; `act`'s runner image does not, and without this the
      # local mirror of this job dies with exit 127 before it has compiled
      # anything.
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          add-rust-environment-hash-key: false
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --all-targets -- -D warnings

  # Every test on each OS against three exact tmux versions, not whatever the
  # runner's package manager has. Until 2026-10-06 this installed apt's tmux
  # (3.4 on ubuntu-24.04) and Homebrew's (3.7c), the laptop had 3.7c, and no
  # one place ran two versions, so a difference between them could only show
  # up here: two bugs only 3.4 to 3.6 have failed three attempts running while
  # every local run was green. 3.4 is the floor (Ubuntu 24.04's packaged tmux),
  # 3.5a the first the key router supports, 3.7c current. The same versions,
  # built by the same script, are what `just ci` runs locally.
  tests:
    name: tests (${{ matrix.os }}, tmux ${{ matrix.tmux }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # scripts/tmux-build.sh --versions; the first step fails if they part.
        tmux: ['3.4', '3.5a', '3.7c']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The matrix and scripts/tmux-build.sh name the same versions
        run: |
          want=$(scripts/tmux-build.sh --versions | tr '\n' ' ')
          [ "$want" = "3.4 3.5a 3.7c " ] || { echo "the script pins: $want; update the matrix"; exit 1; }

      # What scripts/tmux-build.sh needs to compile tmux. iproute2 is for `ss`,
      # which `ports` reads where there is no lsof and which
      # `ports_names_the_pane_that_started_the_listener` needs; GitHub's ubuntu
      # image already has it, act's has neither ss nor lsof. macOS ships lsof.
      - name: Build dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison iproute2
          else
            for f in libevent pkgconf jemalloc; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tmux-companion/tmux/${{ matrix.tmux }}
          key: tmux-${{ runner.os }}-${{ runner.arch }}-${{ matrix.tmux }}-${{ hashFiles('scripts/tmux-build.sh') }}

      # tests/e2e.rs drives a real tmux on its own socket, and with CI set a
      # test that would skip for want of one fails instead. GITHUB_PATH puts
      # this tmux in front of any the image ships, and the check after says so.
      - name: tmux ${{ matrix.tmux }}
        run: scripts/tmux-build.sh '${{ matrix.tmux }}' >> "$GITHUB_PATH"
      - run: '[ "$(tmux -V)" = "tmux ${{ matrix.tmux }}" ] && tmux -V'

      # rust-toolchain.toml pins the version; this installs it on a runner
      # whose preinstalled Rust is something else, and installs rustup itself
      # on one that has none. GitHub's images ship rustup, so the first line is
      # a no-op there; `act`'s runner image does not, and without this the
      # local mirror of this job dies with exit 127 before it has compiled
      # anything.
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          add-rust-environment-hash-key: false
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --no-fail-fast, the same as `just test`: cargo stops at the first test
      # binary that fails, and two red unit tests once hid the whole e2e suite
      # and the whole socket suite behind them. Every binary runs, and the log
      # says which ones went red rather than only the first.
      - run: cargo test --no-fail-fast --all-targets

  # A question left in a file for the owner, in that file's comment syntax, is
  # a hole in the tree; this fails on one so it cannot ship by being forgotten.
  # The script falls back to grep where rg is missing, which it is on a fresh
  # runner, so there is nothing to install; its header says why rg needs
  # --hidden when it is there.
  marks:
    name: review markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-review-marks.sh

  # Every other job runs the pinned toolchain, so `rust-version` in Cargo.toml
  # was a claim nothing tested: it said 1.85 while the source used let chains,
  # which are 1.88. This builds on the toolchain Cargo.toml names, so the floor
  # it promises is one it keeps.
  msrv:
    name: builds on rust-version
    runs-on: ubuntu-latest
    env:
      # A compile check and not a lint pass. An older rustc warns about
      # different things, and with -D warnings this job would fail on lints the
      # pinned toolchain never sees.
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$msrv" ] || { echo "::error::Cargo.toml has no rust-version"; exit 1; }
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
        id: msrv

      # RUSTUP_TOOLCHAIN so the cache keys on the rustc this job checks with:
      # in the repository rust-toolchain.toml answers instead, which would key
      # on the pinned toolchain and install it for nothing.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        with:
          shared-key: msrv
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `+<version>` overrides rust-toolchain.toml, which would otherwise win
      # and make this a second run of the pinned toolchain. The lockfile is
      # used as shipped: rust-version is the floor the locked tree builds on,
      # so a dependency that wants a newer rustc fails here, which is the
      # point, rather than being resolved away.
      - run: cargo +${{ steps.msrv.outputs.version }} check --all-targets --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # `missing_docs` is a warn-level lint in lib.rs; this is what makes an
      # undocumented public item fail a pull request rather than pile up.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install
      # It compiled every dependency from nothing on each run, about a minute
      # of the job's own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs
          add-rust-environment-hash-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps
      # The examples in the library's docs are tests, and `--all-targets` in
      # the test job leaves doctests out.
      - run: cargo test --doc --locked

  # The one check the ruleset on main requires; see the note on `on:`. A
  # matrix leg added or renamed changes nothing in the ruleset this way.
  required:
    needs: [format, clippy, tests, marks, msrv, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
