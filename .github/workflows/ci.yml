name: CI

# Runs the three checks a contributor is asked to run before pushing, so a
# pull request fails here rather than in review. The toolchain comes from
# rust-toolchain.toml, which is what keeps the formatting identical to a
# maintainer's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  check:
    name: clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # tests/e2e.rs drives a real tmux on its own socket. Without one those
      # tests skip themselves, which is worse than failing: the suite that
      # exists to catch behaviour would go quiet and nobody would notice.
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew list tmux >/dev/null 2>&1 || brew install tmux
          fi
      - run: tmux -V

      # rust-toolchain.toml pins the version; this installs it on a runner
      # whose preinstalled Rust is something else.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      # `missing_docs` is a warn-level lint in lib.rs; this is what makes an
      # undocumented public item fail a pull request rather than pile up.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo doc --no-deps
