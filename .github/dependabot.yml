# Dependabot bumps what is pinned, so a pin is a decision that gets revisited
# rather than a version that quietly rots.
#
#   docker          the two FROM lines in playground/Dockerfile, pinned by
#                   digest; a new digest behind the same tag is a pull request
#   github-actions  every `uses:` pinned to a commit SHA, with the version in a
#                   trailing comment that Dependabot rewrites alongside it
#   npm             site/package-lock.json, the docs site's Astro and
#                   Starlight; one pull request a week, majors included,
#                   because the site's own build in docs.yml tests them
#   cargo           Cargo.lock, now that the crate is on crates.io and the lock
#                   is what `cargo install --locked` builds; minor and patch
#                   bumps in one pull request, a major on its own, because a
#                   major is the one that needs reading
#
# Weekly and grouped, so it is one pull request a week per ecosystem rather
# than one per action. A bump that raises the MSRV past `rust-version` fails
# the msrv job in ci.yml rather than merging quietly.
version: 2
updates:
  - package-ecosystem: docker
    directory: /playground
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ['*']
