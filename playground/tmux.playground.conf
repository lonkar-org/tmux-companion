# The playground's own tmux settings. Nothing here is part of tmux-companion;
# it is scaffolding for the tour, and deleting this file leaves the shipped
# example config behind unchanged.

# ── Windows drawn by tmux, not by a subprocess ──────────────────────────────
#
# The full example turns the `window` segment on to show what it can do, and
# then says what it costs: one process spawn per window per redraw, and tmux
# redraws on pane output as well as on the timer. The bar the author runs uses
# tmux's own format, so the playground does too.
set -g window-status-format         "#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-separator      " "
set -g window-status-style          default
set -g window-status-current-style  "fg=#{@theme-color-main-1},bold"

# ── A second status line, so the step follows you ───────────────────────────
#
# The tour runs in its own session, which means the instructions are not on
# screen while you are doing the thing they asked for. tmux draws as many
# status lines as you ask it to, and status-format[1] is a line the companion
# bar does not touch, so the current step can sit under it without the two
# fighting over the same row.
set -g status 2
set -g status-format[1] "#[align=centre,bg=colour236,fg=colour252] #{@playground-step} "
set -g @playground-step "the tour is in the `instructions` session: prefix then i"

# Back to the instructions without hunting for them.
bind -N "playground: back to the instructions" i \
  switch-client -t instructions

# The mouse, because someone trying tmux for ten minutes in a container should
# not have to learn the pane keys before they can look at anything.
set -g mouse on

# tmux's own defaults that make the rest of this bearable.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 20000
set -g focus-events on
setw -g mode-keys vi
