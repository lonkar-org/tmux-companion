# 7-bit fallback: what the bar looks like on a machine whose font nobody
# controls. Every value here replaces the Nerd Font glyph of the same name.
#
# Widths are kept to one or two columns so the bar does not reflow, and no two
# entries are the same, because a status bar where "staged" and "modified" draw
# the same character is a status bar with less information than a blank one.

ADDED = "+"
AGENT = "ai "
HEALTH = "! "
WAITING = "w "
ASKED = "? "
READING = "r "
BUSY = "~ "
AGENT_TO = "> "
AHEAD = "^"
BEHIND = "v"
BRANCH = ""
BUGFIX = "bug "
CHORE = "chore "
CLEAN = "ok"
COPIED = "c"
DELETED = "-"
FAILED = "!"
FEATURE = "feat "
GIT = "git "
GONE = "gone "
HOTFIX = "hot "
MODIFIED = "~"
NEW = "?"
RELEASE = "rel "
RENAMED = "r"
SEPARATOR = "|"
STAGED = "*"
STASHED = "$"
SYNC = "..."
TAG = "tag "
UNMERGED = "x"

# Branch types past the first six: the word the glyph stands for, which is
# also what the cut prefix said. PREFIXED is the catch-all for a prefix
# nothing places, and the name after it keeps its prefix, so it draws nothing.
DOCS = "docs "
PERF = "perf "
REFACTOR = "refactor "
TEST = "test "
CI = "ci "
BUILD = "build "
DEPS = "deps "
STYLE = "style "
REVERT = "revert "
WIP = "wip "
EXPERIMENT = "exp "
BENCH = "bench "
PARKED = "parked "
SECURITY = "sec "
A11Y = "a11y "
I18N = "i18n "
DESIGN = "design "
RESEARCH = "research "
BACKUP = "backup "
PREFIXED = ""

ARROW_RIGHT = ""
ARROW_LEFT = "<"
SLANT_IN = "["
SLANT_OUT = "]"

CAP_SLASH = " /"
CAP_CHEVRON = " >"
CAP_EIGHTH = " |"

# Popups: the icon column in front of a picker's rows.
SESSION = "@"
SSH = "~"
FOLDER = "/"
PROJECT = "p"
PATH_NEW = "+"
PANE = ">"
PORT = ":"
SEARCH = "/"
KEY = "k"
HISTORY = "h"
SETUP = "s"
JOURNAL = "j"
THEME = "t"
SNAPSHOT = "="
QUIET = "z"
CHECK = "on"
OPEN_ITEM = "o"
SKIPPED = "-"
UNKNOWN = "?"
CLOCK = "."
TIMER_CHECK = ""
TIMER_ALERT = "! "
RUN = ">"
IDLE = "zz"
CLOSED = "x"

# The battery: the percentage beside it always says the level in words, so
# these only have to be told apart.
BATTERY_EMPTY = "b0"
BATTERY_QUARTER = "b1"
BATTERY_HALF = "b2"
BATTERY_THREE_QUARTERS = "b3"
BATTERY_FULL = "b4"
PLUGGED = "ac"

# In front of a rate when the bar is drawn without colour.
RATE_DOWN = "dn "
RATE_UP = "up "
