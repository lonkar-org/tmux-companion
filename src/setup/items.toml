[[item]]
id = "copy-menu"
group = "Keys"
kind = "binding"
# @Yogesh(check): one-liner for copy-menu
line = "I'm in copy mode, what can I do with this line?"
command = "open --choose"
key = "g"
table = "copy-mode-vi"
fallback = ["m", "M"]
snippet = '''bind -N "companion: copy menu of open and search, g again for the top" -T copy-mode-vi {key} display-menu -x '#{e|+:#{popup_pane_left},#{copy_cursor_x}}' -y '#{e|+:#{popup_pane_top},#{e|+:#{copy_cursor_y},1}}' "open URL or file under the cursor" o { run-shell "tmux-companion open --pane '##{pane_id}' --cursor-x '##{copy_cursor_x}' -- ##{q:copy_cursor_line}" } "#{?selection_present,,-}open the selection" O { send-keys -X copy-selection-no-clear ; run-shell "tmux-companion open --pane '##{pane_id}' -s" } "" "search the line, in a popup" s { run-shell -C "display-popup -h 65% -w 65% -B -E \"tmux-companion open --choose --pane '##{pane_id}' --cursor-x '##{copy_cursor_x}' -- ##{q:copy_cursor_line}\"" } "#{?selection_present,,-}search the selection, in a popup" S { send-keys -X copy-selection-no-clear ; run-shell -C "display-popup -h 65% -w 65% -B -E 'tmux-companion open --choose -s'" } "" "jump to the top of history" g { send-keys -X history-top }'''
goes = "tmux.conf"

