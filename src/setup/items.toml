# What `tmux-companion setup` lists: everything the tool offers that has to be
# turned on somewhere, how to tell whether it is, and the lines that turn it on.
#
# Data rather than code, so adding an item is adding a table here. The tests in
# src/setup/catalog.rs hold this file to two others: every command a snippet
# runs has to be one clap knows, and every binding has to be the binding
# docs/tmux.conf.full.example writes, key and all, so the two cannot drift.
#
# Fields:
#
#   id        a name for the item, stable, used in the skip file and the block
#   group     Keys, Hooks, Bar, Config or Outside tmux
#   kind      binding, hook, option, config or outside
#   line      what it is for, as the question it answers
#   command   for binding, hook and option: the tmux-companion words it runs,
#             subcommand first, then the flags that tell it from a sibling
#   key       for binding: the key the full example binds
#   table     for binding: prefix, root or copy-mode-vi
#   fallback  for binding: keys to offer when that one is taken
#   hook      for hook: the tmux hook name
#   option    for option: the tmux option
#   setting   for config: the dotted path in config.toml that turns it on
#   contains  for config: an array of tables that has to hold an entry of this
#             name, rather than a value that has to be set
#   seed      for config: when the array is not in the file, write what is in
#             force first, so adding one entry does not drop the defaults
#   check     for outside: marks, claude-hooks, zoxide, nerd-font or clipboard
#   write     false keeps it to the clipboard: the snippet needs editing first
#   snippet   what gets copied, and written; {key} is the key chosen
#   goes      the file it goes in, for the preview

# ── Keys: panes ──────────────────────────────────────────────────────────────

[[item]]
id = "zen"
group = "Keys"
kind = "binding"
# @Yogesh(check): one-liner for zen
line = "Can I get everything but this pane out of the way?"
command = "zen"
key = "z"
table = "prefix"
fallback = ["Z", "M-z"]
snippet = '''bind -N "companion: pane zen, everything but this one goes" {key} run-shell "tmux-companion zen --pane '#{pane_id}'"'''
goes = "tmux.conf"

[[item]]
id = "kill"
group = "Keys"
kind = "binding"
# @Yogesh(check): one-liner for kill
line = "What do I do when C-c doesn't stop it?"
command = "kill"
key = "K"
table = "prefix"
fallback = ["M-k"]
snippet = '''bind -N "companion: pane stop what hangs in it" {key} run-shell "tmux-companion kill --ask --pane '#{pane_id}'"'''
goes = "tmux.conf"

[[item]]
id = "pocket"
group = "Keys"
kind = "binding"
# @Yogesh(check): one-liner for pocket
line = "Can I have a shell beside the editor and put it away again?"
command = "pocket"
key = "`"
table = "prefix"
fallback = ["|", "M-`"]
snippet = '''bind -N "companion: pane the pocket shell, out and away" {key} run-shell "tmux-companion pocket --pane '#{pane_id}'"'''
goes = "tmux.conf"

