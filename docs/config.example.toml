# tmux-companion configuration.
#
# You do not need this file. Every setting below is already the default, and a
# machine with no config file behaves exactly as the binary did before the file
# existed — which is a test, not a promise.
#
# Where it goes, first one found wins:
#
#   1. --config <path>
#   2. $TMUX_COMPANION_CONFIG
#   3. $XDG_CONFIG_HOME/tmux-companion/config.toml
#      (~/.config/tmux-companion/config.toml when XDG_CONFIG_HOME is unset)
#   4. ~/tmux-companion.toml
#
#   tmux-companion config path     which file is being read
#   tmux-companion config check    parse it and say what is wrong
#   tmux-companion config dump     every setting with its default
#
# A key the parser does not recognise is an error naming the key, the line and
# the key you probably meant. A silently ignored setting is worse: it costs an
# evening wondering why nothing changed.

[general]
# A file the daemon appends diagnostics to. Unset means no log.
#
# Worth setting while debugging a picker: inside `display-popup -E`, stderr
# goes wherever the popup went, which is nowhere.
# log = "~/.local/state/tmux-companion/log"

# Path-to-label overrides for the window segment, replacing the abbreviated
# path with a name of your choosing.
#
# This replaces ~/.yrl/lib/dir-aliases, which was a path on one laptop. That
# file is still read when this table is empty, so upgrading drops nothing.
[dirs.aliases]
# "/Users/you/work/some-very-long-project" = "proj"

[git]
# How long a parsed `git status` stays fresh, in seconds. 0 disables the cache,
# which costs a fork on every refresh. At the default, a one-second status bar
# is served from memory four times out of five.
ttl_secs = 5.0

# How long "this path is inside a work tree" is trusted, in seconds.
#
# A directory's repo-ness effectively never changes, so this could be forever,
# except that `git init` in a directory already on the bar would then stay
# invisible until the daemon restarts.
repo_check_ttl_secs = 300.0

# Middle-ellipsize a branch name longer than this many characters.
branch_max_len = 20

# How many characters of the branch name's tail survive the ellipsis.
branch_tail_len = 10

# What the segment draws, and in what order.
#
# A part left out is not rendered. Four hundred untracked build artifacts are
# not information, and if you never push, "ahead" and "behind" are two counts
# you will never read.
#
#   sync       the in-flight and failed-remote block before the branch name
#   branch     the branch name itself
#   state      the clean, dirty, new-branch or gone-upstream marker
#   ahead      commits you have that the upstream does not
#   behind     commits the upstream has that you do not
#   conflicts  files with merge conflicts
#   untracked  untracked files, counted with unstaged additions as git does
#   deleted    deleted files in the work tree
#   renamed    renamed files in the work tree
#   copied     copied files in the work tree
#   modified   modified files in the work tree
#   staged     everything in the index, as one group
#   stash      the stash count
#
# Order is honoured between groups: branch info (ahead, behind, conflicts),
# then the work-tree counts, then staged, then stash. Inside a group the order
# is fixed, because a group is one colour run and reordering its counters would
# move escape sequences rather than glyphs.
parts = ["sync", "branch", "state", "ahead", "behind", "conflicts", "untracked", "deleted", "renamed", "copied", "modified", "staged", "stash"]

# Which branch-name prefixes earn which glyph, tried in the order written.
#
# The prefix is cut off the name the bar draws, so `feat/status-bar` renders as
# the feature glyph and `status-bar`. A name no entry claims keeps the plain
# branch glyph, which is why main, master and dev need no entry of their own.
#
# Matching is by plain prefix, compared without case. Not a regular expression:
# `posts/` is what people actually name branches, and an unanchored pattern
# matching in the middle of a branch name is a bug nobody enjoys finding on a
# status bar.
#
# `icon` takes `{NAME}` for any glyph in src/tmux/icons.rs — FEATURE, BUGFIX,
# HOTFIX, CHORE, RELEASE, TAG, BRANCH, GIT and the rest — so this file stays
# readable without a patched font. Anything else is drawn as written, which is
# how an emoji, a letter or a codepoint your own font has gets in:
#
#   [[git.branch_types]]
#   icon = "{TAG}"
#   prefixes = ["post/", "posts/"]
#
#   [[git.branch_types]]
#   icon = "\U000F04DF "      # a codepoint, TOML's 8-digit escape
#   prefixes = ["parked/"]
#
#   [[git.branch_types]]
#   icon = "wip "
#   prefixes = ["wip/", "spike/"]
#
# The list replaces these six rather than adding to them, so copy what you want
# to keep. `tmux-companion config dump` prints the current list in this shape.
[[git.branch_types]]
icon = "{FEATURE}"
prefixes = ["feat/", "feature/", "features/"]

[[git.branch_types]]
icon = "{BUGFIX}"
prefixes = ["fix/", "fixes/", "bugfix/", "bugfixes/"]

[[git.branch_types]]
icon = "{HOTFIX}"
prefixes = ["hotfix/"]

[[git.branch_types]]
icon = "{CHORE}"
prefixes = ["chore/", "chores/"]

[[git.branch_types]]
icon = "{RELEASE}"
prefixes = ["release/", "releases/"]

[[git.branch_types]]
icon = "{TAG}"
prefixes = ["tag/", "tags/"]

[git.autofetch]
# Fetch the repositories the bar has drawn, on a timer inside the daemon, so
# the ahead and behind counts mean something. A status bar reporting a stale
# number confidently is worse than one reporting nothing.
#
# Off by default, and deliberately. This is the only part of tmux-companion
# that touches the network, and a daemon quietly reaching a remote is not a
# surprise anybody should get from a status bar. The plugin this idea comes
# from is thepante/tmux-git-autofetch, which is alive and worth installing if
# you are not running this.
enabled = false
# Seconds between passes.
interval_secs = 600
# How long one repository gets before it is given up on and its git killed. A
# fetch that hangs holds the pass open and everything behind it goes unfetched;
# the fetch runs with every credential and passphrase prompt disabled, which
# stops the usual cause, and this catches the rest.
timeout_secs = 20
# How long a repository stays on the list after the bar last drew it. Without
# it the daemon would keep fetching everything visited since it started.
remember_secs = 3600

[network]
# Below this many bytes per second the bandwidth segment draws nothing. The
# default is 20 KiB/s: a bar that reacts to every background poll is noise.
#
# This setting was read from the config and then ignored: the segment used a
# constant of the same value, so changing it here did nothing at all.
threshold_bps = 20480

# The block each rate is drawn on. The number is written in the bar's own
# background colour on top of these, which is what makes them read as blocks
# rather than as coloured text.
download_colour = "#5cae36"
upload_colour = "#0262a8"

# The unit after the number: `KiB/s` in `20KiB/s`, drawn dimmer so the figure
# reads first. The default is a dark grey, which is a choice for a dark bar --
# on a light one this is very nearly invisible, so set it to something else.
unit_colour = "colour237"

[battery]
# How long a battery reading stays fresh, in seconds. Reading it is expensive
# and the number does not move fast enough to matter.
ttl_secs = 30.0

[glyphs]
# Which glyph set the bar draws with.
#
#   nerd-font-v3   the codepoints in src/tmux/icons.rs, which need a patched
#                  font; this is the default
#   ascii          7-bit, for a terminal whose font nobody controls
#
# If your bar is a row of boxes, you do not have a Nerd Fonts v3 patch, and
# this is the line to change rather than the thing to put up with.
preset = "nerd-font-v3"

# Replace individual glyphs, by the constant name in src/tmux/icons.rs. These
# are applied on top of the preset, so one missing icon is a reason to fix that
# icon rather than to drop to a whole preset below.
[glyphs.icons]
# STAGED = "*"
# ARROW_RIGHT = ""

[status.right]
# Whether the right-hand side ends with a space. tmux draws it flush to the
# terminal edge, and without this the last glyph sits against the border.
trailing_space = true

# The segments, in the order they are drawn, each with the tmux markup that
# goes in front of it.
#
# `separator_before = ""` means nothing between this segment and the one
# before it, which is a real preference and was not expressible at all while
# the literals lived in tmux.conf.
#
# `{NAME}` expands to the glyph of that name in src/tmux/icons.rs, so this file
# stays readable in an editor with no patched font. A name that does not exist
# is left as you wrote it rather than dropped, because a separator rendering
# `{ARROW_RIGH}` is a typo you can see.
#
# A separator is drawn whether or not the segment after it rendered anything,
# which is what the tmux.conf literals did.

[[status.right.segments]]
name = "git"
separator_before = ""

[[status.right.segments]]
name = "net"
separator_before = ""

[[status.right.segments]]
name = "battery"
separator_before = "#[reverse,fg=color237]{ARROW_RIGHT}#[bg=color237,none]"

# Jobs stopped or running under a pane, drawn by `tmux-companion sh-jobs`.
#
# This was `vim-bg`, which asked one question with one answer baked in: is
# there a suspended nvim under this pane. If you suspend vim, or claude, or a
# cargo watch, this is the table that makes the segment say so.
#
# The cost is why it is not on the status bar by default: finding the children
# of one pid means enumerating the whole process table, which measured 16.25 ms
# of server CPU per call. Bind it to a key, or accept the cost knowingly.
[sh_jobs]
# `stopped` counts only jobs suspended with ctrl-z, which is what vim-bg meant.
# `any` also counts jobs running in the background.
states = "stopped"

# How many icons a busy pane may put on the bar.
max = 3

# The table, in priority order: the first entry whose pattern matches a process
# name wins. `match` is a regular expression, so "^vim$" does not match nvim.
# An unparseable pattern costs that row its icon and nothing else.
#
#   [[sh_jobs.job]]
#   match = "^claude$"
#   icon = "󰚩 "
#   color = "#d97757"
#
# `icon` may contain `{NAME}` placeholders, which expand to the glyph of that
# name in src/tmux/icons.rs. `color` is a tmux colour; leave it out when the
# icon carries its own markup, as the default entry does.
[[sh_jobs.job]]
match = "nvim"
icon = "#[fg=#0262a8,bg=colour235,none] n#[fg=#539035]󰕷im#[fg=colour235,bg=colour233]"
# What to call a window whose active pane is running this, when
# [window_names] is on. Leave it out and this row says nothing about names.
# window_name = "edit"
color = ""

[usage]
# Whether to record which key bindings get picked. The cheat sheet orders each
# box by this, so the keys you actually reach for float to the top of a group.
#
# It records what you press, which is your business and not the tool's, so
# turning it off is one line and nothing else changes.
enabled = true

# Where the log lives. Unset means $XDG_STATE_HOME/tmux-companion/.
# path = "~/.local/state/tmux-companion/keys-usage.tsv"

[project]
# Which directory jumper the project picker and `new-window` list, by name.
# One of:
#
#   zoxide   `zoxide query -l`, most frecent first. The default.
#   z        the `~/.z` database, which rupa/z, zsh-z and z.lua all write.
#            Read straight from the file, because `z` is a shell function and
#            cannot be run from here. Ordered by rank. Honours $_Z_DATA.
#   cdr      zsh's own recent directories, `~/.chpwd-recent-dirs`, most recent
#            first. Nothing to install: it is already there if you have
#            `chpwd_recent_dirs` on. Honours $ZDOTDIR.
#   ghq      `ghq list -p`, every repository ghq has cloned. Not visits, so the
#            list is stable and complete rather than ordered by what you use.
#   none     no directory list. Live sessions and whatever you type.
#
# A jumper that is not installed, or a database that has never been written, is
# the empty list and not an error: you get live sessions and a typed path.
dirs_source = "zoxide"

# A command that prints one absolute path per line. Set, it wins over
# dirs_source; this is how every jumper that is not in the list above works.
#
#   dirs_command = ["fd", "-td", "-d2", ".", "/Users/you/src"]
#   dirs_command = ["sh", "-c", "ls -d ~/src/*/"]
#
# autojump, fasd, jump and the rest go here too, with whichever of their flags
# lists directories -- check their own manual for it rather than trusting a
# line copied from this file, because they do not agree on one.
#
# It is a list of words rather than one string, because splitting a command
# line correctly is a parser that does not belong in a config loader. Anything
# that needs a pipe, a glob or a filter goes through `sh -c`, as above.
dirs_command = []

# The command that records a visit, with the directory appended. Run when you
# open a project or a window, so the place you just went floats up the list.
#
# Empty means whatever the source does on its own: `zoxide add` for zoxide, and
# nothing for the rest. z and cdr are written by your shell on every `cd`, and
# ghq has no notion of a visit.
#
#   visit_command = ["myjumper", "add"]
visit_command = []

# Deprecated, and going away next release. Use dirs_source = "none".
#
# `zoxide = false` still means no directory list, whatever else is set here, so
# a config written before this section had more than one source keeps working.
# zoxide = true

# The layout a new project session starts with.
layout = "default"

# Use a different layout for projects under a path. First match wins.
#
#   [[project.override]]
#   match = "~/work/*"
#   use_layout = "work"

# What a new project session starts with. The first window is selected when the
# session opens.
#
# These two are `edit` and `ai` because that is what one laptop runs. Yours
# might be vim and codex, or one window, or five, or a tail -f on a log and no
# editor anywhere.
# Which window the picker previews for a live session. The window worth seeing
# is the one you would have switched to in order to answer "what is happening
# over there", which on this machine is the agent.
#
# A session without a window by this name previews whichever window it is
# currently on, so every session shows something rather than only the ones that
# happen to match. Empty means never look for a named window.
preview_window = "ai"

[[layout]]
name = "default"

[[layout.window]]
name = "edit"
command = "nvim"
# Hold the name against the running program. Without this an editor window
# follows whatever is running and an agent window renames itself to its own
# version string, which is how windows end up called `2.1.278`.
hold_name = true

[[layout.window]]
name = "ai"
command = "claude"
hold_name = true

# A window with panes. `command` above is the shorthand for a window that holds
# one pane; a [[layout.window.pane]] table takes over when there is more than
# one, and the panes are created in the order they are listed here.
#
# [[layout.window]]
# name = "work"
# # One of tmux's own five names: even-horizontal, even-vertical,
# # main-horizontal, main-vertical, tiled. Panes with nothing set here get
# # tiled, because the shape the splits leave behind is an accident of the
# # order they ran in.
# layout = "main-vertical"
# # main-pane-width for main-vertical, main-pane-height for main-horizontal,
# # ignored by the rest. A percentage needs tmux 3.4; before that, cells.
# main_size = "60%"
#
# [[layout.window.pane]]
# command = "nvim"
# focus = true          # the pane selected when the window opens
#
# [[layout.window.pane]]
# command = "claude"
#
# [[layout.window.pane]]
# cwd = "~/src"         # empty means the project directory
#
# `layout` also takes a raw tmux layout string, which is what
# `tmux list-windows -F '#{window_layout}'` prints. Nothing parses it, so you
# can arrange a window by hand with your usual bindings and paste the result:
#
# layout = "bb62,272x67,0,0{136x67,0,0,1,135x67,137,0,2}"
#
# The cell sizes in that string are absolute, and tmux rescales them
# proportionally, so a layout captured on a wide display comes back cramped on
# a laptop and a preset name travels better.

[notify]
# Say something when a long command finishes in a pane you were not looking at.
# The last clause is the whole value: a command that finishes in front of you
# needs no announcement, and firing for those is the noise that teaches people
# to ignore the ones that matter.
#
# Off by default.
#
# The plugin this comes from is rickstaa/tmux-notify.
enabled = false
# Seconds between scans. One tmux call each.
interval_secs = 2
# How long something has to run before finishing is news.
threshold_secs = 30
# Only announce what finished out of sight. A pane counts as out of sight if it
# was hidden at any point while the command ran, not only at the end, because
# the usual shape is starting something, switching away, and coming back when
# it is already done.
only_when_unwatched = true
# What to run. Empty means tmux's own display-message, which needs nothing
# installed and behaves the same on every platform. A desktop notification is
# one line away, and is not the default because shelling out to osascript or
# notify-send on a machine that has neither is a failure somebody has to debug:
#
#   command = ["notify-send", "{command}", "ran for {duration}"]
#
# {command}, {duration}, {pane} and {message} are substituted in every argument.
command = []
# Commands never worth announcing. An editor, a pager or an agent runs for
# hours and finishing one is not news; without this list every `:q` fires a
# notification about a two-hour nvim session.
ignore = [
  "nvim", "vim", "vi", "emacs", "nano", "less", "more", "man",
  "top", "htop", "btop", "watch", "ssh", "tmux",
  "claude", "codex", "gemini", "lazygit", "tig", "fzf",
]

[window_names]
# Name a window after what is running in its active pane, using the same
# [[sh_jobs.job]] table that gives the status bar its icons. A row drives a
# name only when you give it a `window_name`, so every row written before that
# field existed keeps drawing its icon and saying nothing about names.
#
# Off by default: renaming somebody's windows is visible.
#
# This will not take a name away from somebody who set one. A window with
# automatic-rename off was pinned on purpose, by `hold_name` in a layout or by
# hand, and this leaves it alone unless it was the thing that pinned it. When a
# window stops matching, the name is handed back and tmux renames it again.
#
# The plugins this comes from are ofirgall/tmux-window-name, which is a Python
# daemon, and joshmedeski/tmux-nerd-font-window-name for the icon half.
enabled = false
# Seconds between passes. One tmux call each.
interval_secs = 5

[autoreload]
# Watch tmux's config and source it when it changes, so an edit takes effect
# without you reaching for the reload binding. The daemon already watches this
# file, because the rows behind `keys` and `cheatsheet` are rebuilt when it is
# newer than they are, so this is a stat it was going to do anyway.
#
# Off by default: reloading somebody's tmux config without being asked is a
# thing that happens to their running sessions.
#
# The plugin this comes from is b0o/tmux-autoreload, which watches with entr or
# inotifywait where this compares a modification time. It is archived, since
# February 2024, and its author named nothing to use instead, which is why this
# setting exists rather than a link.
enabled = false
# Seconds between checks. One stat per file, so this can be small.
interval_secs = 2
# Which files to watch. Empty means the tmux config the daemon already watches,
# which is $TMUX_COMPANION_TMUX_CONF or ~/.config/tmux/tmux.conf.
files = []

# The first pass after the daemon starts never reloads: otherwise a daemon
# started right after a config edit would source the file at startup, which is
# a surprise, and a loop when the config is what starts the daemon.

[autosave]
# Whether the daemon saves the session list on a timer, so a reboot does not
# cost the layout.
#
# This is the saving half of tmux-resurrect. Restoring stays on a keybinding on
# purpose: an automatic restore would resurrect a stale layout over a session
# you have already started working in, which is a worse failure than losing a
# layout to a reboot.
#
# Not tmux-continuum, which is the usual answer: continuum drives its timer by
# appending #{continuum_save} to status-right, and status-right here is a
# single #() into this binary, tuned down from five spawns a second.
enabled = true

# Seconds between saves.
interval_secs = 900

# The script that does the saving. Unset means tmux-resurrect's.
# script = "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"

[run]
# Where the commands come from: zsh, bash, fish or atuin.
#
# atuin is worth naming because anybody using it has no .zsh_history worth
# reading: atuin keeps the history in its own database and answers through its
# own command.
history = "zsh"

# The history file, when it is not where the shell usually puts it.
# history_file = "~/.zsh_history"

# How wide the pane is, as a percentage of the window. A percentage rather than
# a column count, so a narrower terminal still splits sensibly.
width_percent = 33

# The pane slides out rather than appearing. tmux has no animation primitive,
# so this is a stepped resize-pane, eased so it reads as a slide rather than a
# jump.
#
# Every step sends SIGWINCH to the neighbouring pane, whose shell repaints its
# prompt, so more steps is smoother here and flickerier next door. Zero opens
# the pane at its full width at once.
slide_steps = 5
slide_ms = 150

# The shell the command runs under.
shell = "zsh"

[clipboard]
# The command to pipe a copy into. Unset picks one for the platform: pbcopy on
# macOS, then wl-copy, then xclip.
#
# This was two if-shell branches on `uname` in tmux.conf. One binary picking
# the right command is one less thing the Linux branch has to special-case.
# copy = "xclip -selection clipboard"

[theme]
# Which theme a session gets before anybody has picked one.
#
# The example config sets a `session-created` hook that runs `theme apply` for
# every new session, so this decides the colour of a session that nothing else
# claims. A session a project map already claims keeps its own colour; this is
# only the answer for the rest.
#
# `theme init` writes six: ember, pine, slate, plum, sand and ink, each with a
# lighter and a darker sibling once `theme gen --shades` has run. Name one of
# those, or one of your own.
#
# Empty leaves unclaimed sessions unpainted, which is also what happens when
# the theme named here is not on disk: there is nothing to source and nothing
# is said about it, because this runs once per session created and a message
# here lands on the terminal at the moment somebody opens a session.
default = "ink"

# A theme per session-name prefix, where the prefix is everything before the
# first `/`, so `w/api` and `w/web` both match `w`. Useful when session names
# already carry a namespace; skip it otherwise and every session takes the
# default above.
#
# [theme.namespace]
# w = "slate"
# a = "plum"

[bar]
# What your status bar itself looks like. Every segment here ends in a
# powerline cap, and a cap is two colours: the segment's, and whatever is
# behind it. That second one used to be a compiled-in `colour233`, which is one
# person's tmux.conf and nobody else's, so a bar set to anything else got
# wedges and outline backgrounds in a colour that appears nowhere on screen.
#
# Set this to whatever `status-style` says. Anything tmux takes works, so
# `colour233`, `#121212`, `black` and `default` are all fine; `default` leaves
# the terminal's own background showing through, which is what a transparent
# bar wants.
#
# `tmux-companion doctor` reads the live `status-style` and says when the two
# have drifted apart.
background = "color233"

# The background behind the current window in the window list. Only the
# `window` segment draws this, and only when that segment is turned on.
current_window_background = "color236"

[picker]
# How every picker is laid out: the key search, the cheat sheet, the project
# list, the run history and the theme list all take their shape from here, so
# one setting changes all of them rather than five drifting apart.
#
# Where the preview pane goes: right, left, bottom, top, or none for no
# preview at all. A picker whose rows have nothing to preview gets the whole
# width for its list whatever this says.
preview = "right"

# The preview's share of the popup, as a percentage. Clamped to 20-80, because
# outside that one half of the split is too narrow to read.
preview_percent = 55

[open]
# What happens when `open` finds a file rather than a URL: which pane the
# editor opens in, and which editor.
#
# `right` puts it beside the pane you were in, `bottom` puts it underneath.
# Right by default, because a file and the log you found it in read better
# side by side; bottom is better on a narrow terminal, where two columns of
# sixty are two columns nobody can read.
split = "right"

# How much of the window that pane takes, as a percentage. Zero lets tmux
# halve it, which is what it did before this was a setting.
size_percent = 0

# The editor, and how it is told to jump to a line and column. `{path}`,
# `{line}` and `{column}` are replaced; the path arrives already quoted for
# the shell, so do not put quotes around `{path}` yourself.
#
# The quotes around the `+call` matter. tmux runs a split's command through
# `sh`, and `nvim +call cursor(2,22) file` is a shell syntax error, so the
# pane opened, complained to nobody, and closed again. Opening a file at a
# line had never worked until they were added.
#
# Some others:
#   helix    "hx {path}:{line}:{column}"
#   emacs    "emacsclient -nw +{line}:{column} {path}"
#   vim      the default works unchanged
editor = "nvim '+call cursor({line},{column})' {path}"
